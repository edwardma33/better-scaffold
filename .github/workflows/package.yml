name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: go test ./...
      - run: go vet ./...
      - run: node --test scripts/package.test.mjs scripts/notices.test.mjs
      - run: node scripts/package.mjs
      - name: Smoke-test packaged CLI
        run: |
          node dist/npm/better-scaffold/bin/better-scaffold.cjs --version
          node dist/npm/better-scaffold/bin/better-scaffold.cjs init --help
