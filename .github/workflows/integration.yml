name: Generated app integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffold
          POSTGRES_PASSWORD: scaffold
          POSTGRES_DB: scaffold
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate, build, and exercise apps
        env:
          TEST_DATABASE_URL: postgres://scaffold:scaffold@localhost:5432/scaffold
          INTEGRATION_ARTIFACTS: ${{ runner.temp }}/integration-artifacts
        run: go run ./cmd/integration-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentication-browser-check
          path: ${{ runner.temp }}/integration-artifacts
          if-no-files-found: ignore
